name = "kaida-renovatie-preview"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"

[vars]
MAX_UPLOAD_MB = "8"
PREVIEW_MODE = "true"
WHATSAPP_ENABLED = "false"
