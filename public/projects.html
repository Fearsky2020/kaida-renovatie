<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e9">
  <title>全部工程案例 | 凯达装修</title>
  <meta name="description" content="凯达装修工程案例：全屋定制、室内翻新、餐馆装修、花园翻新、橱柜定制和卫浴翻新。">
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22261f;background:#f5f1e9}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}.wrap{width:min(1220px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(245,241,233,.94);backdrop-filter:blur(14px);border-bottom:1px solid #ddd6cc}.topin{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900;text-decoration:none;font-size:20px}.actions{display:flex;gap:8px}.actions a{color:inherit;text-decoration:none;padding:10px 13px;border:1px solid #d7d0c6;border-radius:10px;background:#fff}.actions .dark{background:#22261f;color:#fff;border-color:#22261f}.hero{padding:62px 0 34px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:#a86e38}.hero h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:8px 0 14px}.hero p{max-width:700px;color:#6f6b65;line-height:1.7;margin:0}.filters{display:flex;gap:8px;overflow:auto;padding:0 0 22px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{white-space:nowrap;border:1px solid #d8d0c5;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.filters button.active{background:#22261f;color:#fff;border-color:#22261f}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:70px}.card{background:#fff;border:1px solid #e1d9ce;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 8px 30px rgba(35,31,25,.04)}.photo{aspect-ratio:4/3;background:#ddd center/cover no-repeat;position:relative}.photo span{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.meta{padding:16px}.meta h2{font-size:19px;margin:0 0 7px}.meta p{font-size:13px;color:#77716a;margin:0}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d8d0c5;border-radius:16px;padding:70px 20px;text-align:center;color:#77716a}.contact{margin:0 auto 70px;background:#22261f;color:#fff;border-radius:18px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.contact h2{margin:0 0 7px}.contact p{margin:0;color:#c9c7c1}.contact a{color:#22261f;background:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:800;white-space:nowrap}.viewer{border:0;padding:0;background:transparent;width:min(1100px,calc(100% - 24px));max-width:none}.viewer::backdrop{background:rgba(14,14,13,.83)}.viewer-card{background:#111;border-radius:18px;overflow:hidden;color:#fff;position:relative}.viewer-main{height:min(68vh,720px);display:grid;place-items:center;background:#050505}.viewer-main img{max-width:100%;max-height:100%;object-fit:contain}.viewer-close{position:absolute;right:12px;top:12px;z-index:4;border:0;background:rgba(255,255,255,.92);width:42px;height:42px;border-radius:50%;font-size:26px;cursor:pointer}.viewer-arrow{position:absolute;top:42%;z-index:3;width:46px;height:60px;border:0;border-radius:12px;background:rgba(255,255,255,.88);font-size:28px;cursor:pointer}.viewer-prev{left:12px}.viewer-next{right:12px}.viewer-info{padding:18px 20px 20px}.viewer-info h2{margin:0 0 7px}.viewer-info p{color:#c4c4c0;line-height:1.6;margin:4px 0}.thumbs{display:flex;gap:8px;overflow:auto;padding:0 20px 18px}.thumbs button{border:2px solid transparent;padding:0;background:none;border-radius:9px;overflow:hidden;flex:0 0 auto}.thumbs button.active{border-color:#c68a4e}.thumbs img{width:76px;height:58px;object-fit:cover;display:block}.count{font-size:12px;color:#aaa}.footer{padding:0 0 36px;color:#7b756e;font-size:13px}.footer a{color:inherit}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.wrap{width:min(100% - 22px,1220px)}.topin{min-height:62px}.brand{font-size:18px}.actions a:first-child{display:none}.actions a{padding:9px 11px;font-size:13px}.hero{padding:38px 0 24px}.grid{grid-template-columns:1fr;gap:12px}.card{border-radius:13px}.contact{align-items:flex-start;flex-direction:column}.viewer{width:100%;height:100%;margin:0}.viewer-card{border-radius:0;min-height:100dvh;display:flex;flex-direction:column}.viewer-main{height:62dvh}.viewer-info{padding-bottom:12px}.viewer-arrow{top:35%}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap topin"><a class="brand" href="/">凯达装修 · KAIDA</a><div class="actions"><a href="/">返回首页</a><a class="dark" href="/#contact">获取报价</a></div></div></header>

  <main class="wrap">
    <section class="hero"><div class="eyebrow">PROJECTS · 工程案例</div><h1>全部工程</h1><p>这里展示凯达选择对外公开的工程案例。点击项目可以查看整组照片；首页仍然只展示 6 个精选项目。</p></section>
    <div class="filters" id="filters" aria-label="工程分类"></div>
    <section class="grid" id="grid"><div class="empty">正在读取工程案例…</div></section>
    <section class="contact"><div><h2>有类似项目？</h2><p>把现场照片和城市发给我们，先看看怎么做。</p></div><a href="/#contact">联系凯达 →</a></section>
    <div class="footer">© 2026 Kaida · <a href="privacy.html">隐私 / Privacy</a></div>
  </main>

  <dialog class="viewer" id="viewer">
    <div class="viewer-card">
      <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭">×</button>
      <button class="viewer-arrow viewer-prev" id="viewerPrev" type="button" aria-label="上一张">‹</button>
      <button class="viewer-arrow viewer-next" id="viewerNext" type="button" aria-label="下一张">›</button>
      <div class="viewer-main"><img id="viewerImage" alt="工程照片"></div>
      <div class="viewer-info"><h2 id="viewerTitle"></h2><p id="viewerMeta"></p><p id="viewerDescription"></p><div class="count" id="viewerCount"></div></div>
      <div class="thumbs" id="viewerThumbs"></div>
    </div>
  </dialog>

  <script>
    (() => {
      const grid = document.getElementById('grid');
      const filters = document.getElementById('filters');
      const viewer = document.getElementById('viewer');
      const viewerImage = document.getElementById('viewerImage');
      const viewerTitle = document.getElementById('viewerTitle');
      const viewerMeta = document.getElementById('viewerMeta');
      const viewerDescription = document.getElementById('viewerDescription');
      const viewerCount = document.getElementById('viewerCount');
      const viewerThumbs = document.getElementById('viewerThumbs');
      let projects = [];
      let currentFilter = '全部';
      let currentProject = null;
      let currentIndex = 0;

      const imagesOf = (project) => {
        const images = Array.isArray(project?.images) ? project.images.filter(Boolean) : [];
        if (!images.length && project?.image) images.push(project.image);
        return images;
      };

      function renderFilters() {
        const cats = ['全部', ...new Set(projects.map(p => p.category).filter(Boolean))];
        filters.replaceChildren(...cats.map(cat => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = cat;
          button.className = cat === currentFilter ? 'active' : '';
          button.addEventListener('click', () => { currentFilter = cat; renderFilters(); renderGrid(); });
          return button;
        }));
      }

      function renderGrid() {
        const visible = currentFilter === '全部' ? projects : projects.filter(p => p.category === currentFilter);
        grid.replaceChildren();
        if (!visible.length) {
          const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = '这个分类还没有公开工程。'; grid.appendChild(empty); return;
        }
        visible.forEach(project => {
          const images = imagesOf(project);
          const card = document.createElement('article'); card.className = 'card'; card.tabIndex = 0;
          const photo = document.createElement('div'); photo.className = 'photo'; if (images[0]) photo.style.backgroundImage = `url("${images[0]}")`;
          const count = document.createElement('span'); count.textContent = `${images.length || 0} 张`; photo.appendChild(count);
          const meta = document.createElement('div'); meta.className = 'meta';
          const h2 = document.createElement('h2'); h2.textContent = project.title || '工程案例';
          const p = document.createElement('p'); p.textContent = [project.city, project.category].filter(Boolean).join(' · ');
          meta.append(h2, p); card.append(photo, meta);
          card.addEventListener('click', () => openProject(project));
          card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProject(project); } });
          grid.appendChild(card);
        });
      }

      function openProject(project) {
        currentProject = project; currentIndex = 0; renderViewer(); viewer.showModal(); document.body.style.overflow = 'hidden';
      }

      function renderViewer() {
        if (!currentProject) return;
        const images = imagesOf(currentProject); if (!images.length) return;
        currentIndex = (currentIndex + images.length) % images.length;
        viewerImage.src = images[currentIndex]; viewerImage.alt = `${currentProject.title || '工程'} ${currentIndex + 1}`;
        viewerTitle.textContent = currentProject.title || '工程案例';
        viewerMeta.textContent = [currentProject.city, currentProject.category].filter(Boolean).join(' · ');
        viewerDescription.textContent = currentProject.description || '';
        viewerDescription.hidden = !currentProject.description;
        viewerCount.textContent = `${currentIndex + 1} / ${images.length}`;
        document.getElementById('viewerPrev').hidden = images.length < 2; document.getElementById('viewerNext').hidden = images.length < 2;
        viewerThumbs.replaceChildren(...images.map((src, index) => {
          const button = document.createElement('button'); button.type = 'button'; button.className = index === currentIndex ? 'active' : '';
          const img = document.createElement('img'); img.src = src; img.alt = `照片 ${index + 1}`; button.appendChild(img);
          button.addEventListener('click', () => { currentIndex = index; renderViewer(); }); return button;
        }));
      }

      function closeViewer() { if (viewer.open) viewer.close(); document.body.style.overflow = ''; }
      document.getElementById('viewerClose').addEventListener('click', closeViewer);
      document.getElementById('viewerPrev').addEventListener('click', () => { currentIndex -= 1; renderViewer(); });
      document.getElementById('viewerNext').addEventListener('click', () => { currentIndex += 1; renderViewer(); });
      viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
      viewer.addEventListener('close', () => { document.body.style.overflow = ''; });
      document.addEventListener('keydown', e => { if (!viewer.open) return; if (e.key === 'ArrowLeft') { currentIndex -= 1; renderViewer(); } if (e.key === 'ArrowRight') { currentIndex += 1; renderViewer(); } });

      fetch('/api/site-content', { headers: { Accept: 'application/json' } })
        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
        .then(body => {
          projects = Array.isArray(body?.content?.projectLibrary) ? body.content.projectLibrary : [];
          projects.sort((a,b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
          renderFilters(); renderGrid();
        })
        .catch(() => { grid.innerHTML = '<div class="empty">工程案例暂时无法读取，请稍后再试。</div>'; });
    })();
  </script>
</body>
</html>
