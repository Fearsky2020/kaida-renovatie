<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e9">
  <title>全部工程案例 | 凯达装修</title>
  <meta name="description" content="凯达装修工程案例：全屋定制、室内翻新、餐馆装修、花园翻新、橱柜定制和卫浴翻新。">
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22261f;background:#f5f1e9;--bg:#f5f1e9;--paper:#fff;--ink:#22261f;--muted:#6f6b65;--line:#ddd6cc;--accent:#a96f37;--dark:#22261f;--shadow:0 10px 30px rgba(35,31,25,.06)}
    html[data-theme="dark"]{color-scheme:dark;--bg:#151714;--paper:#1c1f1b;--ink:#ece9e2;--muted:#aaa79f;--line:#34382f;--accent:#bd8246;--dark:#ece9e2;--shadow:0 12px 34px rgba(0,0,0,.26)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,a{font:inherit;color:inherit}.wrap{width:min(1220px,calc(100% - 32px));margin:auto}
    .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topin{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;text-decoration:none}.brand img{width:190px;height:auto;max-height:58px;display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .actions{display:flex;gap:8px;align-items:center}.actions a,.actions button{color:inherit;text-decoration:none;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer}.actions .dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}.icon-btn{width:42px;padding:0!important;min-height:42px;font-size:19px;display:grid;place-items:center}
    .hero{padding:62px 0 34px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--accent)}.hero h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:8px 0 14px}.hero p{max-width:720px;color:var(--muted);line-height:1.7;margin:0}
    .filters{display:flex;gap:8px;overflow:auto;padding:0 0 22px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 13px;cursor:pointer}.filters button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}.photo{aspect-ratio:4/3;background:#ddd center/cover no-repeat;position:relative}.photo span{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,var(--paper) 92%,transparent);color:var(--ink);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.meta{padding:16px}.meta h2{font-size:19px;margin:0 0 7px}.meta p{font-size:13px;color:var(--muted);margin:0}.empty{grid-column:1/-1;background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:70px 20px;text-align:center;color:var(--muted)}
    .contact{margin:0 auto 70px;background:#22261f;color:#fff;border-radius:18px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.contact h2{margin:0 0 7px}.contact p{margin:0;color:#c9c7c1}.contact a{color:#22261f;background:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:800;white-space:nowrap}.footer{padding:0 0 36px;color:var(--muted);font-size:13px}.footer a{color:inherit}
    .viewer{border:0;padding:0;background:transparent;width:min(1100px,calc(100% - 24px));max-width:none}.viewer::backdrop{background:rgba(14,14,13,.83)}.viewer-card{background:#111;border-radius:18px;overflow:hidden;color:#fff;position:relative}.viewer-main{height:min(68vh,720px);display:grid;place-items:center;background:#050505}.viewer-main img{max-width:100%;max-height:100%;object-fit:contain}.viewer-close,.viewer-arrow{position:absolute;z-index:4;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,18,.72);color:#fff;backdrop-filter:blur(10px);cursor:pointer}.viewer-close{right:12px;top:12px;width:44px;height:44px;border-radius:50%;font-size:28px}.viewer-arrow{top:42%;width:48px;height:62px;border-radius:12px;font-size:32px}.viewer-prev{left:12px}.viewer-next{right:12px}.viewer-info{padding:18px 20px 20px}.viewer-info h2{margin:0 0 7px}.viewer-info p{color:#c4c4c0;line-height:1.6;margin:4px 0}.thumbs{display:flex;gap:8px;overflow:auto;padding:0 20px 18px}.thumbs button{border:2px solid transparent;padding:0;background:none;border-radius:9px;overflow:hidden;flex:0 0 auto}.thumbs button.active{border-color:#c68a4e}.thumbs img{width:76px;height:58px;object-fit:cover;display:block}.count{font-size:12px;color:#aaa}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){.wrap{width:min(100% - 22px,1220px)}.topin{min-height:62px}.brand img{width:138px;max-height:50px}.actions a.home-link{display:none}.actions a,.actions button{padding:9px 10px;font-size:13px}.icon-btn{width:40px}.hero{padding:38px 0 24px}.grid{grid-template-columns:1fr;gap:12px}.card{border-radius:13px}.contact{align-items:flex-start;flex-direction:column}.viewer{width:100%;height:100%;margin:0}.viewer-card{border-radius:0;min-height:100dvh;display:flex;flex-direction:column}.viewer-main{height:62dvh}.viewer-info{padding-bottom:12px}.viewer-arrow{top:35%}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap topin">
    <a class="brand" href="/" aria-label="凯达装修首页"><img src="assets/kaida-logo.svg?v=20260904" alt="凯达装修 · Kai Da Company"><span class="sr-only" id="brandTitle">凯达装修</span></a>
    <div class="actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="切换明暗模式"></button><button id="langToggle" class="icon-btn" type="button" aria-label="切换语言">NL</button><a class="home-link" id="homeLink" href="/">返回首页</a><a class="dark" id="quoteLink" href="/#contact">获取报价</a></div>
  </div></header>
  <main class="wrap">
    <section class="hero"><div class="eyebrow" id="eyebrow">PROJECTS · 工程案例</div><h1 id="pageTitle">全部工程</h1><p id="pageIntro">这里展示凯达选择对外公开的工程案例。点击项目可以查看整组照片；首页仍然只展示 6 个精选项目。</p></section>
    <div class="filters" id="filters" aria-label="工程分类"></div>
    <section class="grid" id="grid"><div class="empty" id="loadingText">正在读取工程案例…</div></section>
    <section class="contact"><div><h2 id="contactTitle">有类似项目？</h2><p id="contactText">把现场照片和城市发给我们，先看看怎么做。</p></div><a id="contactLink" href="/#contact">联系凯达 →</a></section>
    <div class="footer">© 2026 Kaida · <a id="privacyLink" href="privacy.html">隐私说明</a></div>
  </main>
  <dialog class="viewer" id="viewer"><div class="viewer-card"><button class="viewer-close" id="viewerClose" type="button" aria-label="关闭">×</button><button class="viewer-arrow viewer-prev" id="viewerPrev" type="button" aria-label="上一张">‹</button><button class="viewer-arrow viewer-next" id="viewerNext" type="button" aria-label="下一张">›</button><div class="viewer-main"><img id="viewerImage" alt=""></div><div class="viewer-info"><h2 id="viewerTitle"></h2><p id="viewerMeta"></p><p id="viewerDescription"></p><div class="count" id="viewerCount"></div></div><div class="thumbs" id="viewerThumbs"></div></div></dialog>
  <script src="theme.js?v=20260901-2245"></script>
  <script>
    (() => {
      const LANG_KEY='kaida-lang';
      const categoryNl={'全屋定制':'Interieur op maat','室内翻新':'Interieurrenovatie','餐馆装修':'Restaurantverbouwing','花园翻新':'Tuinrenovatie','橱柜定制':'Maatwerk kasten','卫浴翻新':'Badkamer & toilet','厕所 淋浴房':'Badkamer & toilet','厕所/淋浴房':'Badkamer & toilet'};
      const copy={
        zh:{brand:'凯达装修',toggle:'NL',title:'全部工程',eyebrow:'PROJECTS · 工程案例',intro:'这里展示凯达选择对外公开的工程案例。点击项目可以查看整组照片；首页仍然只展示 6 个精选项目。',home:'返回首页',quote:'获取报价',all:'全部',empty:'这个分类还没有公开工程。',loading:'正在读取工程案例…',error:'工程案例暂时无法读取，请稍后再试。',project:'工程案例',photos:n=>`${n} 张`,contactTitle:'有类似项目？',contactText:'把现场照片和城市发给我们，先看看怎么做。',contact:'联系凯达 →',privacy:'隐私说明',close:'关闭',prev:'上一张',next:'下一张',photo:n=>`照片 ${n}`},
        nl:{brand:'KAIDA RENOVATIE',toggle:'ZH',title:'Alle projecten',eyebrow:'PROJECTS · VAKWERK',intro:'Bekijk hier onze openbare projecten. Open een project om alle foto’s te zien; op de homepage tonen we alleen een selectie van maximaal zes projecten.',home:'Home',quote:'Offerte aanvragen',all:'Alle',empty:'Er zijn nog geen openbare projecten in deze categorie.',loading:'Projecten laden…',error:'Projecten kunnen momenteel niet worden geladen. Probeer het later opnieuw.',project:'Renovatieproject',photos:n=>`${n} foto’s`,contactTitle:'Een vergelijkbaar project?',contactText:'Stuur ons foto’s van de ruimte en uw plaats, dan kijken we met u mee.',contact:'Neem contact op →',privacy:'Privacy',close:'Sluiten',prev:'Vorige foto',next:'Volgende foto',photo:n=>`Foto ${n}`}
      };
      const params=new URLSearchParams(location.search);let lang=params.get('lang')==='nl'?'nl':params.get('lang')==='zh'?'zh':null;try{if(!lang){const saved=localStorage.getItem(LANG_KEY);lang=saved==='nl'?'nl':'zh'}}catch{}if(!lang)lang='zh';
      const grid=document.getElementById('grid'),filters=document.getElementById('filters'),viewer=document.getElementById('viewer'),viewerImage=document.getElementById('viewerImage'),viewerTitle=document.getElementById('viewerTitle'),viewerMeta=document.getElementById('viewerMeta'),viewerDescription=document.getElementById('viewerDescription'),viewerCount=document.getElementById('viewerCount'),viewerThumbs=document.getElementById('viewerThumbs');let projects=[],currentFilter='__all__',currentProject=null,currentIndex=0;
      const hasCjk=value=>/[\u3400-\u9fff]/.test(String(value||''));
      const imagesOf=project=>{const images=Array.isArray(project?.images)?project.images.filter(Boolean):[];if(!images.length&&project?.image)images.push(project.image);return images};
      const categoryText=project=>{const c=project?.category||'';if(lang==='zh')return c;return project?.categoryNl||categoryNl[c]||(hasCjk(c)?copy.nl.project:c)};
      const titleText=project=>{const t=project?.title||'';if(lang==='zh')return t||copy.zh.project;if(project?.titleNl)return project.titleNl;if(t&&!hasCjk(t))return t;const type=categoryText(project)||copy.nl.project;return project?.city?`${type} · ${project.city}`:type};
      const descriptionText=project=>{const d=project?.description||'';if(lang==='zh')return d;if(project?.descriptionNl)return project.descriptionNl;return hasCjk(d)?'':d};
      function applyLanguage(){const t=copy[lang];document.documentElement.lang=lang==='nl'?'nl':'zh-CN';document.title=lang==='nl'?'Projecten | Kaida Renovatie':'全部工程案例 | 凯达装修';document.getElementById('brandTitle').textContent=t.brand;document.getElementById('langToggle').textContent=t.toggle;document.getElementById('pageTitle').textContent=t.title;document.getElementById('eyebrow').textContent=t.eyebrow;document.getElementById('pageIntro').textContent=t.intro;document.getElementById('homeLink').textContent=t.home;document.getElementById('quoteLink').textContent=t.quote;document.getElementById('contactTitle').textContent=t.contactTitle;document.getElementById('contactText').textContent=t.contactText;document.getElementById('contactLink').textContent=t.contact;document.getElementById('privacyLink').textContent=t.privacy;document.getElementById('viewerClose').setAttribute('aria-label',t.close);document.getElementById('viewerPrev').setAttribute('aria-label',t.prev);document.getElementById('viewerNext').setAttribute('aria-label',t.next);try{localStorage.setItem(LANG_KEY,lang)}catch{}renderFilters();renderGrid();if(viewer.open&&currentProject)renderViewer()}
      function renderFilters(){if(!filters)return;const raw=[...new Set(projects.map(p=>p.category).filter(Boolean))];const items=[{key:'__all__',label:copy[lang].all},...raw.map(c=>({key:c,label:lang==='nl'?(categoryNl[c]||(hasCjk(c)?copy.nl.project:c)):c}))];filters.replaceChildren(...items.map(item=>{const button=document.createElement('button');button.type='button';button.textContent=item.label;button.className=item.key===currentFilter?'active':'';button.addEventListener('click',()=>{currentFilter=item.key;renderFilters();renderGrid()});return button}))}
      function renderGrid(){if(!grid)return;const visible=currentFilter==='__all__'?projects:projects.filter(p=>p.category===currentFilter);grid.replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=copy[lang].empty;grid.appendChild(empty);return}visible.forEach(project=>{const images=imagesOf(project),card=document.createElement('article');card.className='card';card.tabIndex=0;const photo=document.createElement('div');photo.className='photo';if(images[0])photo.style.backgroundImage=`url("${images[0]}")`;const count=document.createElement('span');count.textContent=copy[lang].photos(images.length||0);photo.appendChild(count);const meta=document.createElement('div');meta.className='meta';const h2=document.createElement('h2');h2.textContent=titleText(project);const p=document.createElement('p');p.textContent=[project.city,categoryText(project)].filter(Boolean).join(' · ');meta.append(h2,p);card.append(photo,meta);card.addEventListener('click',()=>openProject(project));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProject(project)}});grid.appendChild(card)})}
      function openProject(project){currentProject=project;currentIndex=0;renderViewer();viewer.showModal();document.body.style.overflow='hidden'}
      function renderViewer(){if(!currentProject)return;const images=imagesOf(currentProject);if(!images.length)return;currentIndex=(currentIndex+images.length)%images.length;viewerImage.src=images[currentIndex];viewerImage.alt=`${titleText(currentProject)} · ${copy[lang].photo(currentIndex+1)}`;viewerTitle.textContent=titleText(currentProject);viewerMeta.textContent=[currentProject.city,categoryText(currentProject)].filter(Boolean).join(' · ');const desc=descriptionText(currentProject);viewerDescription.textContent=desc;viewerDescription.hidden=!desc;viewerCount.textContent=`${currentIndex+1} / ${images.length}`;document.getElementById('viewerPrev').hidden=images.length<2;document.getElementById('viewerNext').hidden=images.length<2;viewerThumbs.replaceChildren(...images.map((src,index)=>{const button=document.createElement('button');button.type='button';button.className=index===currentIndex?'active':'';button.setAttribute('aria-label',copy[lang].photo(index+1));const img=document.createElement('img');img.src=src;img.alt='';button.appendChild(img);button.addEventListener('click',()=>{currentIndex=index;renderViewer()});return button}))}
      function closeViewer(){if(viewer.open)viewer.close();document.body.style.overflow=''}
      document.getElementById('langToggle').addEventListener('click',()=>{lang=lang==='zh'?'nl':'zh';currentFilter='__all__';applyLanguage()});document.getElementById('viewerClose').addEventListener('click',closeViewer);document.getElementById('viewerPrev').addEventListener('click',()=>{currentIndex-=1;renderViewer()});document.getElementById('viewerNext').addEventListener('click',()=>{currentIndex+=1;renderViewer()});viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});viewer.addEventListener('close',()=>{document.body.style.overflow=''});document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){currentIndex-=1;renderViewer()}if(e.key==='ArrowRight'){currentIndex+=1;renderViewer()}});
      applyLanguage();
      fetch('/api/site-content',{headers:{Accept:'application/json'}}).then(r=>r.ok?r.json():Promise.reject(new Error(`HTTP ${r.status}`))).then(body=>{projects=Array.isArray(body?.content?.projectLibrary)?body.content.projectLibrary:[];projects.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));renderFilters();renderGrid()}).catch(()=>{grid.innerHTML=`<div class="empty">${copy[lang].error}</div>`});
    })();
  </script>
</body>
</html>
