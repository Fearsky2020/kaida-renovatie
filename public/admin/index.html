<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>凯达装修后台 · 首页管理</title>
  <link rel="stylesheet" href="homepage.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-top">
      <div class="brandline">
        <img src="../assets/kaida-mark.svg" alt="">
        <div><strong>凯达装修</strong><span>傻瓜式网站管理</span></div>
      </div>
      <div class="top-actions">
        <a href="inquiries.html">客户询价</a>
        <button id="changeToken">更换管理员密钥</button>
        <a class="primary" href="../index.html" target="_blank" rel="noopener">打开网站 ↗</a>
      </div>
    </header>

    <main class="admin-main">
      <div class="intro">
        <div>
          <h1>首页管理</h1>
          <p>看到哪张图想换，就点那张下面的“选择新图片”。不用碰代码。</p>
        </div>
        <div class="tip">建议用横图。手机拍的照片也可以，单张不要超过 10 MB。</div>
      </div>

      <div id="editorRoot"></div>
    </main>

    <div class="save-bar">
      <button class="save-all" id="saveAll">保存文字修改</button>
      <span class="global-status" id="globalStatus">图片更换后会自动保存</span>
    </div>
  </div>

  <script src="homepage.js"></script>
</body>
</html>
